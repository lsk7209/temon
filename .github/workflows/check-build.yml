name: Check Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Result and attempt contracts
        run: |
          node scripts/test-results-contract.cjs
          node scripts/test-result-idempotency.cjs
          node scripts/test-result-attempt.cjs
          node scripts/test-static-quiz-save.cjs
          node scripts/test-attempt-analytics.cjs
          node scripts/test-analytics-consent.cjs
          node scripts/test-result-save-notice.cjs
          node scripts/test-tests-pagination.cjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

