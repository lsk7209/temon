services:
  web:
    image: ${TEMON_IMAGE:?Set an immutable Temon image}
    restart: unless-stopped
    init: true
    env_file: [.env.production]
    expose: ["3000"]
    environment:
      TEMON_STAGING: "false"
      TEMON_GENERATION_ENABLED: "false"
      TEMON_CRON_OWNER: vps
      TEMON_CRON_INSTANCE: vps
      TEMON_TRUST_PROXY: "true"
      NEXT_PUBLIC_APP_URL: https://temon.kr
      APP_REVISION: ${APP_REVISION:?Set the deployed source revision}
    volumes:
      - runtime-cache:/app/.next/cache
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}
    networks:
      runtime:
        aliases: [temon-web]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  runtime-cache:
    name: temon-production-cache-${CACHE_REVISION:?Set revision-specific cache}
networks:
  runtime:
    name: temon_runtime
